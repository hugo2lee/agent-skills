name: Validate Agent Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "skills-ref==0.1.1"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Shellcheck maintainer scripts
        run: shellcheck scripts/*.sh

      - name: Run repository and standards validation
        run: scripts/validate.sh

      - name: Run npx discovery and installation smoke test
        run: scripts/smoke-test-npx.sh
