$schema: "https://json-schema.org/draft/2020-12/schema"
title: Generated Skill Knowledge Record
type: object
additionalProperties: false
required:
  - schema_version
  - generated
  - generated_by
  - skill_path
  - provenance
  - generation
  - lifecycle
  - ownership
properties:
  schema_version:
    type: string
    const: "1"
  generated:
    type: boolean
    const: true
  generated_by:
    type: string
    minLength: 1
  skill_path:
    type: string
    minLength: 1
  provenance:
    type: object
    additionalProperties: false
    required:
      - source_paths
      - source_commit
    properties:
      source_paths:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      source_commit:
        type: string
        minLength: 1
  generation:
    type: object
    additionalProperties: false
    required:
      - version
      - command
    properties:
      version:
        type: string
        minLength: 1
      generated_at:
        type: string
      command:
        type: string
        minLength: 1
  lifecycle:
    type: object
    additionalProperties: false
    required:
      - status
    properties:
      status:
        enum:
          - candidate
          - active
          - deprecated
          - archived
      confidence:
        enum:
          - low
          - medium
          - high
  ownership:
    type: object
    additionalProperties: false
    required:
      - owner
      - scope
    properties:
      owner:
        type: string
        minLength: 1
      scope:
        enum:
          - project
          - organization
          - global
  promotion:
    type: object
    additionalProperties: false
    required:
      - reviewed
      - status
      - evidence_refs
    properties:
      reviewed:
        const: true
      status:
        const: approved
      evidence_refs:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
allOf:
  - if:
      properties:
        ownership:
          properties:
            scope:
              enum:
                - organization
                - global
          required:
            - scope
    then:
      required:
        - promotion
