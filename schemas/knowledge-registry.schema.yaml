$schema: "https://json-schema.org/draft/2020-12/schema"
title: Knowledge Registry
type: object
additionalProperties: false
required:
  - schema_version
  - artifacts
properties:
  schema_version:
    type: string
    const: "1"
  artifacts:
    type: array
    items:
      $ref: "#/$defs/artifact"
$defs:
  artifact:
    type: object
    additionalProperties: false
    required:
      - id
      - path
      - type
      - status
      - scope
      - owner
      - provenance
    properties:
      id:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
      path:
        type: string
        minLength: 1
      type:
        enum:
          - source
          - reference
          - evidence
          - decision
          - generated
          - skill
      status:
        enum:
          - draft
          - active
          - candidate
          - deprecated
          - archived
          - unverified
          - stale
      scope:
        enum:
          - project
          - organization
          - global
      owner:
        type: string
        minLength: 1
      ownership:
        type: object
        additionalProperties: false
        required:
          - owner
        properties:
          owner:
            type: string
            minLength: 1
          team:
            type: string
            minLength: 1
          scope:
            enum:
              - project
              - organization
              - global
      provenance:
        type: object
        additionalProperties: false
        properties:
          canonical_sources:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          external_sources:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          commit:
            type: string
            minLength: 1
      verification:
        type: object
        additionalProperties: false
        properties:
          commands:
            type: array
            items:
              type: string
              minLength: 1
          last_verified_commit:
            type: string
            minLength: 1
          last_verified_at:
            type: string
            minLength: 1
      generation:
        type: object
        additionalProperties: false
        required:
          - generated_from
          - version
        properties:
          generated_from:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          command:
            type: string
            minLength: 1
          version:
            type: string
            minLength: 1
      promotion:
        type: object
        additionalProperties: false
        required:
          - reviewed
          - status
          - evidence_refs
        properties:
          reviewed:
            const: true
          status:
            const: approved
          evidence_refs:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
      related_skills:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    allOf:
      - if:
          properties:
            type:
              enum:
                - reference
                - evidence
                - decision
                - generated
                - skill
        then:
          properties:
            provenance:
              anyOf:
                - required:
                    - canonical_sources
                - required:
                    - external_sources
      - if:
          properties:
            type:
              const: generated
        then:
          required:
            - generation
      - if:
          properties:
            scope:
              enum:
                - organization
                - global
        then:
          required:
            - promotion
