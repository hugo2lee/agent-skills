$schema: "https://json-schema.org/draft/2020-12/schema"
title: Generated Skill Metadata
type: object
required:
  - metadata
properties:
  metadata:
    type: object
    required:
      - generated
      - generated_by
      - provenance
      - generation
      - lifecycle
      - ownership
    properties:
      generated:
        const: true
      generated_by:
        type: string
        minLength: 1
      provenance:
        type: object
        required:
          - source_paths
          - source_commit
        properties:
          source_paths:
            type: array
            items:
              type: string
            minItems: 1
          source_commit:
            type: string
            minLength: 1
      generation:
        type: object
        required:
          - version
        properties:
          version:
            type: string
          generated_at:
            type: string
          command:
            type: string
      lifecycle:
        type: object
        required:
          - status
        properties:
          status:
            enum:
              - candidate
              - active
              - deprecated
              - archived
          confidence:
            enum:
              - low
              - medium
              - high
      ownership:
        type: object
        required:
          - scope
        properties:
          scope:
            enum:
              - project
              - organization
              - global
