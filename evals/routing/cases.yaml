# Routing cases are discovery tests, not expected prose answers.
# language is deliberately explicit so the repository validator can enforce the
# v0.2.0 distribution: at least 12 Chinese, 12 English, and 6 mixed cases.
- id: ROUTE-ZH-001
  language: zh
  prompt: >
    这个 Go service 直接创建 postgres client，repository 需要加 interface 吗？
  expected_primary:
    - architecture-boundaries
  allowed_secondary: []
  forbidden:
    - ddd-lite
    - planning-and-task-breakdown

